<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>設計課タスクボード</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: 固定ヘッダー + 4列ボード（列の中だけ縦スクロール、ページはスクロールしない） */
:root {
  --bg: #e9edf1;
  --surface: #ffffff;
  --surface-2: #f4f6f9;
  --ink: #18212c;
  --ink-2: #576272;
  --ink-3: #8a94a2;
  --line: #d3dae2;
  --accent: #0e6488;
  --accent-ink: #ffffff;
  --accent-soft: #dcecf3;
  --late: #b8322a;
  --late-bg: #fbe7e4;
  --soon: #8a5a00;
  --soon-bg: #fcefcf;
  --ok: #2c7a4b;
  --ok-bg: #e0f1e6;
  --drop: #cfe3ee;
  --shadow: 0 1px 2px rgba(20, 36, 52, .08), 0 2px 8px rgba(20, 36, 52, .05);
  --tag1-bg: #dfe9fb; --tag1-fg: #1f4c9a;
  --tag2-bg: #dff3ea; --tag2-fg: #1d6a46;
  --tag3-bg: #fbe8d9; --tag3-fg: #934514;
  --tag4-bg: #f3e1f1; --tag4-fg: #85306f;
  --tag5-bg: #e5e8ee; --tag5-fg: #3d4757;
  --tag6-bg: #f6f0d2; --tag6-fg: #6e5a0c;
  --font-ui: "BIZ UDPGothic", "Yu Gothic UI", "Meiryo UI", "Meiryo", "Hiragino Sans", sans-serif;
  --font-num: "IBM Plex Mono", "Consolas", "Menlo", monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11161c; --surface: #1a2129; --surface-2: #212932; --ink: #e5eaf0; --ink-2: #a0abb8; --ink-3: #6f7a88;
    --line: #2d3641; --accent: #5fb0d8; --accent-ink: #0b1a22; --accent-soft: #183442;
    --late: #ff8f80; --late-bg: #3b1d1a; --soon: #f0c064; --soon-bg: #362a0e; --ok: #74d39a; --ok-bg: #16301f;
    --drop: #1b3a4a; --shadow: 0 1px 2px rgba(0,0,0,.35);
    --tag1-bg: #1c2d4a; --tag1-fg: #9dbdf4; --tag2-bg: #17322a; --tag2-fg: #8fd8b3; --tag3-bg: #3a2516; --tag3-fg: #f2b184;
    --tag4-bg: #36203a; --tag4-fg: #e7a6da; --tag5-bg: #262d37; --tag5-fg: #b9c2cf; --tag6-bg: #332d12; --tag6-fg: #e3cf7c;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11161c; --surface: #1a2129; --surface-2: #212932; --ink: #e5eaf0; --ink-2: #a0abb8; --ink-3: #6f7a88;
  --line: #2d3641; --accent: #5fb0d8; --accent-ink: #0b1a22; --accent-soft: #183442;
  --late: #ff8f80; --late-bg: #3b1d1a; --soon: #f0c064; --soon-bg: #362a0e; --ok: #74d39a; --ok-bg: #16301f;
  --drop: #1b3a4a; --shadow: 0 1px 2px rgba(0,0,0,.35);
  --tag1-bg: #1c2d4a; --tag1-fg: #9dbdf4; --tag2-bg: #17322a; --tag2-fg: #8fd8b3; --tag3-bg: #3a2516; --tag3-fg: #f2b184;
  --tag4-bg: #36203a; --tag4-fg: #e7a6da; --tag5-bg: #262d37; --tag5-fg: #b9c2cf; --tag6-bg: #332d12; --tag6-fg: #e3cf7c;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 14px/1.5 var(--font-ui);
  overflow: hidden;
}
[hidden] { display: none !important; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app {
  height: 100%;
  display: grid;
  grid-template-rows: auto auto 1fr;
  padding-inline: 16px;
  padding-block: 12px 14px;
  gap: 10px;
}

/* ---------- ヘッダー ---------- */
.topbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; }
.brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.brand h1 { margin: 0; font-size: 18px; font-weight: 700; letter-spacing: .02em; }
.brand .today { color: var(--ink-2); font-size: 13px; font-variant-numeric: tabular-nums; }
.mode-pill {
  font-size: 11px; letter-spacing: .08em; padding: 2px 8px; border-radius: 999px;
  background: var(--soon-bg); color: var(--soon); font-weight: 700;
}
.mode-pill.live { background: var(--ok-bg); color: var(--ok); }
.topbar .spacer { flex: 1 1 auto; }
.tools { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.btn {
  border: 1px solid var(--line); background: var(--surface); border-radius: 6px;
  padding: 5px 12px; font-size: 13px;
}
.btn:hover { border-color: var(--ink-3); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.mock-user { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-2); }
.mock-user select { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 4px 6px; font-size: 13px; }

/* ---------- メンバー切替 + 状況サマリー ---------- */
.subbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; }
.tabs { display: flex; flex-wrap: wrap; gap: 4px; padding: 3px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; }
.tab {
  border: 0; background: transparent; border-radius: 6px; padding: 4px 12px; font-size: 13px; color: var(--ink-2);
}
.tab[aria-selected="true"] { background: var(--surface); color: var(--ink); font-weight: 700; box-shadow: var(--shadow); }
.tab .me { font-size: 10px; margin-left: 4px; padding: 0 5px; border-radius: 4px; background: var(--accent-soft); color: var(--accent); font-weight: 700; }
.summary { display: flex; flex-wrap: wrap; gap: 6px; font-size: 12px; }
.chip { padding: 2px 9px; border-radius: 999px; background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.chip b { font-family: var(--font-num); font-weight: 500; margin-left: 3px; }
.chip.late { background: var(--late-bg); color: var(--late); border-color: transparent; }
.chip.soon { background: var(--soon-bg); color: var(--soon); border-color: transparent; }

/* ---------- ボード ---------- */
.board-wrap { min-height: 0; overflow-x: auto; }
.board {
  height: 100%;
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 12px;
}
.col {
  min-height: 0; min-width: 0;
  display: flex; flex-direction: column;
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-radius: 10px;
  transition: background-color .12s, border-color .12s;
}
.col-head {
  display: flex; align-items: baseline; gap: 8px;
  padding: 10px 12px 8px;
  border-bottom: 1px solid var(--line);
}
.col-head h2 { margin: 0; font-size: 14px; font-weight: 700; }
.col-head .sub { font-size: 11px; color: var(--ink-3); }
.col-head .count { margin-left: auto; font-family: var(--font-num); font-size: 12px; color: var(--ink-2); }
.col-head .lock { font-size: 11px; color: var(--ink-3); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; }
.col-body {
  flex: 1 1 auto; min-height: 0; overflow-y: auto;
  display: flex; flex-direction: column; gap: 8px;
  padding: 10px;
}
.col.drag-over { background: var(--drop); border-color: var(--accent); }
.col.drag-denied { opacity: .55; }
.col[data-col="approved"] .card { background: var(--surface-2); }
.col[data-col="approved"] .subject { color: var(--ink-2); }
.empty { margin: 4px 2px; font-size: 12px; color: var(--ink-3); }

/* ---------- カード ---------- */
.card {
  position: relative;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 9px 11px 10px;
  box-shadow: var(--shadow);
  display: flex; flex-direction: column; gap: 5px;
  cursor: grab;
}
.card:hover { border-color: var(--ink-3); }
.card.dragging { opacity: .4; }
.card.saving::after {
  content: "保存中…"; position: absolute; right: 8px; bottom: 6px;
  font-size: 10px; color: var(--accent);
}
.card-top { display: flex; align-items: flex-start; gap: 8px; min-height: 18px; }
.parent {
  min-width: 0; flex: 1 1 auto;
  font-size: 11px; color: var(--ink-3);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.tag {
  margin-left: auto; flex: 0 0 auto;
  font-size: 11px; font-weight: 700; line-height: 1.6;
  padding: 0 7px; border-radius: 4px;
  max-width: 55%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.tag.t1 { background: var(--tag1-bg); color: var(--tag1-fg); }
.tag.t2 { background: var(--tag2-bg); color: var(--tag2-fg); }
.tag.t3 { background: var(--tag3-bg); color: var(--tag3-fg); }
.tag.t4 { background: var(--tag4-bg); color: var(--tag4-fg); }
.tag.t5 { background: var(--tag5-bg); color: var(--tag5-fg); }
.tag.t6 { background: var(--tag6-bg); color: var(--tag6-fg); }
.subject { margin: 0; font-size: 14px; font-weight: 700; line-height: 1.45; overflow-wrap: anywhere; }
.card-foot { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.num { font-family: var(--font-num); font-size: 11px; color: var(--ink-3); }
.num a { color: inherit; text-decoration: none; }
.num a:hover { text-decoration: underline; }
.due {
  margin-left: auto;
  font-size: 11px; font-variant-numeric: tabular-nums;
  padding: 1px 7px; border-radius: 4px; color: var(--ink-2); background: var(--surface-2);
}
.due.late { background: var(--late-bg); color: var(--late); font-weight: 700; }
.due.soon { background: var(--soon-bg); color: var(--soon); font-weight: 700; }
.due.none { color: var(--ink-3); background: transparent; padding-inline: 0; }
.card.is-late { border-left: 3px solid var(--late); padding-left: 9px; }

/* 進捗（ステータス 0%〜80% を切り替える） */
.progress { display: grid; grid-template-columns: repeat(5, 1fr); gap: 3px; margin-top: 2px; }
.progress button {
  border: 1px solid var(--line); background: var(--surface); border-radius: 4px;
  padding: 2px 0; font-family: var(--font-num); font-size: 11px; color: var(--ink-3);
  font-variant-numeric: tabular-nums;
}
.progress button.filled { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.progress button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.progress button:hover:not([aria-pressed="true"]) { border-color: var(--accent); }

/* ---------- 中止ドロップゾーン ---------- */
.cancel-zone {
  position: fixed; left: 50%; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
  padding: 10px 26px; border-radius: 999px; border: 2px dashed var(--late);
  background: var(--surface); color: var(--late); font-weight: 700; font-size: 13px;
  box-shadow: var(--shadow); z-index: 5;
}
.cancel-zone.drag-over { background: var(--late-bg); }

/* ---------- トースト ---------- */
.toasts {
  position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  display: flex; flex-direction: column; gap: 8px; z-index: 10; max-width: min(420px, calc(100% - 32px));
}
.toast {
  display: flex; align-items: center; gap: 12px;
  background: var(--ink); color: var(--bg); border-radius: 8px; padding: 9px 14px; font-size: 13px;
  box-shadow: 0 6px 20px rgba(0,0,0,.18);
}
.toast.error { background: var(--late); color: #fff; }
.toast button { border: 0; background: transparent; color: inherit; text-decoration: underline; font-weight: 700; padding: 0; }

/* ---------- 設定ダイアログ ---------- */
.overlay { position: fixed; inset: 0; background: rgba(10, 16, 22, .45); display: grid; place-items: center; z-index: 20; padding: 16px; }
.dialog {
  width: min(520px, 100%); max-height: 100%; overflow: auto;
  background: var(--surface); border-radius: 12px; padding: 20px 22px; box-shadow: 0 12px 40px rgba(0,0,0,.25);
  display: flex; flex-direction: column; gap: 14px;
}
.dialog h2 { margin: 0; font-size: 16px; }
.field { display: flex; flex-direction: column; gap: 4px; }
.field label, .field .label { font-size: 12px; color: var(--ink-2); font-weight: 700; }
.field input[type="text"], .field input[type="password"] {
  border: 1px solid var(--line); background: var(--surface-2); border-radius: 6px; padding: 7px 9px; font-family: var(--font-num); font-size: 13px;
}
.radios { display: flex; gap: 16px; flex-wrap: wrap; }
.hint { font-size: 12px; color: var(--ink-3); margin: 0; }
.test-result { font-size: 12px; margin: 0; padding: 8px 10px; border-radius: 6px; background: var(--surface-2); color: var(--ink-2); white-space: pre-wrap; }
.test-result.ok { background: var(--ok-bg); color: var(--ok); }
.test-result.ng { background: var(--late-bg); color: var(--late); }
.dialog-actions { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }

.loading { display: grid; place-items: center; color: var(--ink-3); font-size: 13px; }

/* 中継プログラムにつながっていないときの案内 */
.tabs:empty { display: none; }
.connect { grid-column: 1 / -1; display: grid; place-items: center; padding: 16px; }
.connect-card {
  width: min(560px, 100%); background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
  padding: 22px 24px; display: flex; flex-direction: column; gap: 14px; box-shadow: var(--shadow);
}
.connect-card h2 { margin: 0; font-size: 17px; }
.connect-card p { margin: 0; color: var(--ink-2); }
.steps { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 10px; counter-reset: step; }
.steps li { display: grid; grid-template-columns: 26px 1fr; gap: 10px; align-items: start; counter-increment: step; }
.steps li::before {
  content: counter(step); display: grid; place-items: center; width: 24px; height: 24px; border-radius: 50%;
  background: var(--accent-soft); color: var(--accent); font-family: var(--font-num); font-size: 12px;
}
.steps li span { padding-top: 2px; }
.connect-card .waiting { font-size: 12px; color: var(--ink-3); display: flex; align-items: center; gap: 8px; }
.connect-card .waiting::before {
  content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--soon);
  animation: blink 1.4s ease-in-out infinite;
}
@keyframes blink { 50% { opacity: .25; } }
.connect-card .links { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
a.btn { text-decoration: none; display: inline-block; }

/* タグ: 先頭の優先番号 + 名前 */
.tag .code { font-family: var(--font-num); font-weight: 500; margin-right: 4px; opacity: .85; }
.tag.urgent { background: var(--late); color: var(--surface); }
.plan { font-size: 11px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.plan.over { color: var(--soon); font-weight: 700; }

/* タブ: 未整理 */
.tab.inbox-tab { color: var(--ink); }
.tab .badge { margin-left: 5px; font-family: var(--font-num); font-size: 11px; padding: 0 6px; border-radius: 999px; background: var(--late); color: var(--surface); }
.tab .badge.zero { background: var(--line); color: var(--ink-2); }
.tab-sep { width: 1px; align-self: stretch; background: var(--line); margin: 2px 4px; }

/* ---------- 未整理の振り分け画面 ---------- */
.inbox {
  height: 100%; min-height: 0;
  display: grid; grid-template-columns: minmax(260px, 1fr) minmax(0, 1.7fr); gap: 12px;
}
.mail-list { list-style: none; margin: 0; padding: 10px; display: flex; flex-direction: column; gap: 6px; }
.mail {
  width: 100%; text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 8px;
  padding: 8px 10px; display: flex; flex-direction: column; gap: 3px;
}
.mail:hover { border-color: var(--ink-3); }
.mail[aria-current="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.mail .meta { display: flex; gap: 8px; font-size: 11px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.mail .meta .missing { margin-left: auto; color: var(--soon); font-weight: 700; }
.mail .title { font-weight: 700; font-size: 13px; overflow-wrap: anywhere; }
.triage {
  min-height: 0; overflow-y: auto;
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  padding: 16px 18px; display: flex; flex-direction: column; gap: 14px;
}
.triage h2 { margin: 0; font-size: 15px; }
.triage .from { margin: 0; font-size: 12px; color: var(--ink-3); }
.triage .grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 16px; }
.triage input[type="text"], .triage input[type="date"], .triage select, .triage textarea {
  width: 100%; border: 1px solid var(--line); background: var(--surface-2); border-radius: 6px; padding: 7px 9px; font-size: 13px;
}
.triage textarea { min-height: 140px; resize: vertical; line-height: 1.6; }
.triage .row { display: flex; gap: 8px; align-items: center; }
.triage .row input { flex: 1 1 auto; min-width: 0; }
.triage .req { color: var(--late); margin-left: 3px; }
.preview { margin: 0; padding: 8px 10px; border-radius: 6px; background: var(--accent-soft); color: var(--ink); font-weight: 700; overflow-wrap: anywhere; }
.preview .lbl { display: block; font-size: 11px; font-weight: 400; color: var(--ink-2); }
.triage .error-msg { margin: 0; color: var(--late); font-size: 12px; }
.triage .actions { display: flex; gap: 8px; justify-content: flex-end; align-items: center; flex-wrap: wrap; }
.triage .actions .hint { margin-right: auto; }
.btn-mini { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 4px 8px; font-size: 12px; white-space: nowrap; }

@media (max-width: 860px) {
  body { overflow: auto; }
  .board { grid-template-columns: repeat(4, minmax(250px, 80%)); }
  .inbox { grid-template-columns: 1fr; height: auto; }
  .triage .grid2 { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="app" id="app">
  <header class="topbar">
    <div class="brand">
      <h1>設計課タスクボード</h1>
      <span class="today" id="today"></span>
      <span class="mode-pill" id="modePill">モック</span>
    </div>
    <div class="spacer"></div>
    <div class="tools">
      <label class="mock-user" id="mockUserWrap" for="mockUser">モックの操作ユーザー
        <select id="mockUser"></select>
      </label>
      <button class="btn" id="reloadBtn" type="button">再読み込み</button>
      <button class="btn" id="settingsBtn" type="button">接続設定</button>
    </div>
  </header>

  <div class="subbar">
    <div class="tabs" role="tablist" id="tabs" aria-label="表示するメンバー"></div>
    <div class="summary" id="summary" aria-live="polite"></div>
  </div>

  <div class="board-wrap">
    <main class="board" id="board"><div class="loading">読み込み中…</div></main>
    <div class="inbox" id="inbox" hidden>
      <section class="col" aria-label="未整理のチケット">
        <header class="col-head">
          <h2>未整理</h2>
          <span class="sub">担当またはバージョンが未設定</span>
          <span class="count" id="inboxCount">0</span>
        </header>
        <div class="col-body" style="padding:0"><ul class="mail-list" id="mailList"></ul></div>
      </section>
      <form class="triage" id="triage" novalidate></form>
    </div>
  </div>
</div>

<div class="cancel-zone" id="cancelZone" hidden>ここにドロップすると「中止」</div>
<div class="toasts" id="toasts" aria-live="polite"></div>

<div class="overlay" id="settings" hidden>
  <form class="dialog" id="settingsForm" aria-labelledby="settingsTitle">
    <h2 id="settingsTitle">接続設定</h2>
    <div class="field">
      <span class="label">データの取得元</span>
      <div class="radios">
        <label><input type="radio" name="mode" id="modeRelay" value="relay"> 中継プログラム経由（通常はこれ）</label>
        <label><input type="radio" name="mode" id="modeMock" value="mock"> モック（ダミーデータ）</label>
        <label><input type="radio" name="mode" id="modeLive" value="live"> 直接接続</label>
      </div>
    </div>
    <p class="hint" id="relayHint">このPCで動いている中継プログラムを通して Redmine を読み書きします。API キーは中継プログラムに保存されています。</p>
    <div id="directFields" hidden>
      <p class="hint">Redmine 側で CORS が許可されている場合だけ使えます。</p>
      <div class="field">
        <label for="redmineUrl">Redmine の URL</label>
        <input type="text" id="redmineUrl" placeholder="https://redmine.example.com" autocomplete="off">
      </div>
      <div class="field">
        <label for="apiKey">自分の API キー</label>

/* =====================================================================
 * 2. 日付・名前の解釈
 * ===================================================================== */
const DAY = 86400000;
function startOfToday() { const d = new Date(); d.setHours(0, 0, 0, 0); return d; }
function parseDate(s) { if (!s) return null; const [y, m, d] = s.slice(0, 10).split('-').map(Number); return new Date(y, m - 1, d); }
function isoDate(d) { const p = n => String(n).padStart(2, '0'); return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`; }
function addDays(d, n) { const x = new Date(d); x.setDate(x.getDate() + n); return x; }
function diffDays(d) { return Math.round((d - startOfToday()) / DAY); }
function jpDate(d) { return `${d.getMonth() + 1}/${d.getDate()}(${'日月火水木金土'[d.getDay()]})`; }
function hhmm(iso) { const d = new Date(iso); return `${d.getHours()}:${String(d.getMinutes()).padStart(2, '0')}`; }
function toHalfWidth(s) { return s.replace(/[０-９／]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0)); }

// 件名の先頭の【10/15】を「本来の締切」として読む。年は今日に一番近い年とみなす
const TITLE_DATE = /^\s*【\s*([0-9０-９]{1,2})\s*[\/／]\s*([0-9０-９]{1,2})\s*】\s*/;
function parseTitle(subject) {
  const m = TITLE_DATE.exec(subject || '');
  if (!m) return { deadline: null, text: subject || '' };
  const mo = Number(toHalfWidth(m[1])), d = Number(toHalfWidth(m[2]));
  const t = startOfToday();
  let best = null;
  for (const y of [t.getFullYear() - 1, t.getFullYear(), t.getFullYear() + 1]) {
    const c = new Date(y, mo - 1, d);
    if (!best || Math.abs(c - t) < Math.abs(best - t)) best = c;
  }
  return { deadline: best, text: subject.slice(m[0].length) };
}
function buildTitle(text, deadline) { return deadline ? `【${deadline.getMonth() + 1}/${deadline.getDate()}】${text}` : text; }

// バージョン名の先頭の数字を優先度として読む（01_不具合対応 → 1）
function parseVersion(name) {
  if (!name) return { prio: null, code: null, label: '未分類' };
  const m = /^([0-9０-９]{1,3})[\s_.\-:：・、]*(.*)$/.exec(name);
  if (!m || !m[2]) return { prio: null, code: null, label: name };
  return { prio: Number(toHalfWidth(m[1])), code: toHalfWidth(m[1]), label: m[2] };
}

// apiKey を null にすると中継プログラム経由（キーは中継プログラムが付ける）
function createRedmineApi(baseUrl, apiKey) {
  const base = baseUrl.replace(/\/+$/, '');
  async function req(path, options = {}) {
    let res;
    try {
      res = await fetch(base + path, {
        ...options,
        headers: { ...(apiKey ? { 'X-Redmine-API-Key': apiKey } : {}), 'Content-Type': 'application/json', ...(options.headers || {}) },
      });
    } catch (e) {
      // fetch 自体が失敗するのは、ほぼ CORS 拒否かネットワーク遮断（中継なら中継が止まっている）
      throw new Error(apiKey
        ? 'Redmine に接続できませんでした。Redmine 側で CORS が許可されていないか、ネットワークで遮断されています。'
        : '中継プログラムに接続できません。kanban_relay.py が起動しているか確認してください。');
    }
    if (!res.ok) {
      let detail = '';
      try { const j = await res.json(); detail = (j.errors || []).join(' / '); } catch (_) { /* 本文なし */ }
      if (res.status === 401) throw new Error('API キーが正しくありません (401)');
      if (res.status === 403) throw new Error('この操作の権限がありません (403)');
      throw new Error(`Redmine がエラーを返しました (${res.status}) ${detail}`);
    }
    const text = await res.text();
    return text ? JSON.parse(text) : null;
  }
  async function allIssues(query) {
    const scope = CONFIG.projectId ? `project_id=${encodeURIComponent(CONFIG.projectId)}&` : '';
    const out = [];
    for (let offset = 0; ; ) {
      const j = await req(`/issues.json?${scope}${query}&limit=100&offset=${offset}`);
      out.push(...j.issues);
      offset += j.issues.length;
      if (!j.issues.length || offset >= j.total_count) return out;
    }
  }
  const versionCache = new Map();
  return {
    async currentUser() {
      const j = await req('/users/current.json');
      return { id: j.user.id, name: `${j.user.lastname} ${j.user.firstname}` };
    },
    async issuesFor(userId) {
      const since = isoDate(addDays(startOfToday(), -CONFIG.approvedDays));
      const [open, closed] = await Promise.all([
        allIssues(`assigned_to_id=${userId}&status_id=open`),
        allIssues(`assigned_to_id=${userId}&status_id=closed&updated_on=${encodeURIComponent('>=' + since)}`),
      ]);
      return [...open, ...closed];
    },
    async issuesByIds(ids) {
      if (!ids.length) return [];
      return allIssues(`issue_id=${ids.join(',')}&status_id=*`);
    },
    async inboxIssues() {
      // 「担当なし」と「バージョンなし」は API で OR 指定できないので 2 回取って合わせる
      const [noAssignee, noVersion] = await Promise.all([
        allIssues('assigned_to_id=%21*&status_id=open'),
        allIssues('fixed_version_id=%21*&status_id=open'),
      ]);
      const merged = new Map([...noAssignee, ...noVersion].map(i => [i.id, i]));
      return [...merged.values()];
    },
    async withChildren(ids) {
      if (!ids.length) return new Set();
      if (CONFIG.childFilterSupported) {
        const hits = await allIssues(`issue_id=${ids.join(',')}&child_id=*&status_id=*`);
        return new Set(hits.map(i => i.id));
      }
      // 子チケット条件が使えない Redmine 向け: 1 件ずつ children を確認（同時 4 件まで）
      const found = new Set();
      for (let i = 0; i < ids.length; i += 4) {
        await Promise.all(ids.slice(i, i + 4).map(async id => {
          const j = await req(`/issues/${id}.json?include=children`);
          if (j.issue.children && j.issue.children.length) found.add(id);
        }));
      }
      return found;
    },
    async versions(projectId) {
      const key = String(CONFIG.projectId || projectId);
      if (!versionCache.has(key)) {
        const j = await req(`/projects/${encodeURIComponent(key)}/versions.json`);
        versionCache.set(key, j.versions.filter(v => v.status === 'open').map(v => ({ id: v.id, name: v.name })));
      }
      return versionCache.get(key);
    },
    async updateIssue(id, fields) {
      await req(`/issues/${id}.json`, { method: 'PUT', body: JSON.stringify({ issue: fields }) });
      if (!('status_id' in fields)) return;
      // Redmine はワークフローで許可されていないステータス変更をエラーにせず無視するので、結果を確かめる
      const { issue } = await req(`/issues/${id}.json`);
      if (issue.status.id !== fields.status_id) {
        const to = (statusById[fields.status_id] || {}).name || `ID ${fields.status_id}`;
        throw new Error(`Redmine がステータスの変更を受け付けませんでした（今は「${issue.status.name}」のまま）。` +
          `ワークフローで「${issue.status.name}」→「${to}」が許可されているか確認してください。`);
      }
    },
  };
}

/* =====================================================================
 * 4. 設定の保存（このブラウザの中だけ）
 * ===================================================================== */
const STORE_KEY = 'designBoard.settings.v2';
function loadSettings() {
  const fallback = { mode: CONFIG.defaultMode, url: '', key: '', mockUserId: 2 };
  try { return { ...fallback, ...JSON.parse(localStorage.getItem(STORE_KEY) || '{}') }; } catch (_) { return fallback; }
}
function saveSettings() { try { localStorage.setItem(STORE_KEY, JSON.stringify(settings)); } catch (_) { /* 保存できなくても動作は続ける */ } }

/* =====================================================================
 * 5. 状態
 * ===================================================================== */
let settings = loadSettings();
let api = null;
const INBOX = 'inbox';
const state = {
  me: null, view: null,               // view = メンバーの ID または 'inbox'
  issues: new Map(), parents: new Map(), saving: new Set(),
  inbox: [], inboxSel: null, versions: [],
};
const statusById = Object.fromEntries(CONFIG.statuses.map(s => [s.id, s]));
const colOf = issue => (statusById[issue.status.id] || {}).col;
// 列にドロップしたときに設定するステータス ID（statuses の col から決める）
function statusForColumn(colKey) {
  const list = CONFIG.statuses.filter(s => s.col === colKey);
  if (colKey === 'doing') list.sort((a, b) => (a.ratio ?? 0) - (b.ratio ?? 0));
  return list.length ? list[0].id : null;
}
const cancelStatusId = () => statusForColumn('cancelled');
const isManager = () => state.me && CONFIG.managerUserIds.includes(state.me.id);
const visibleColumns = () => CONFIG.columns.filter(c => !c.managerView || isManager());

const relayBase = () => `http://127.0.0.1:${CONFIG.relay.port}`;
// 中継プログラムが出したページなら、同じ場所(相対パス)で API を呼べる
const servedByRelay = [relayBase(), `http://localhost:${CONFIG.relay.port}`].includes(location.origin);
const relayRoot = () => (servedByRelay ? '' : relayBase());
function buildApi() {
  if (settings.mode === 'relay') api = createRedmineApi(relayRoot() + '/api', null);
  else if (settings.mode === 'live' && settings.url && settings.key) api = createRedmineApi(settings.url, settings.key);
  else api = createMockApi(() => settings.mockUserId);
}

// 中継プログラムが動いていれば { redmine_url, user } を返す。止まっていれば null
async function pingRelay() {
  try {
    const res = await fetch(relayRoot() + '/ping', { cache: 'no-store' });
    return res.ok ? await res.json() : null;
  } catch (_) { return null; }
}

/* =====================================================================
 * 6. 描画（ボード）
 * ===================================================================== */
const $ = id => document.getElementById(id);
function h(tag, attrs = {}, ...children) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const c of children.flat()) if (c != null && c !== false) el.append(c.nodeType ? c : String(c));
  return el;
}

function tagClass(name) {
  if (CONFIG.versionColors[name]) return 't' + CONFIG.versionColors[name];
  let n = 0; for (const ch of name) n = (n * 31 + ch.charCodeAt(0)) >>> 0;
  return 't' + ((n % 6) + 1);
}

function renderTag(versionName) {
  const v = parseVersion(versionName);
  const urgent = v.prio !== null && v.prio <= CONFIG.urgentPriority;
  return h('span', { class: `tag ${urgent ? 'urgent' : tagClass(v.label)}`, title: `対象バージョン: ${versionName || '未設定'}` },
    v.code ? h('span', { class: 'code' }, v.code) : null, v.label);
}

// 締切 = 件名の【M/D】。なければ Redmine の期日（作業完了予定）で代用する
function deadlineInfo(issue) {
  const col = colOf(issue);
  const { deadline } = parseTitle(issue.subject);
  const plan = parseDate(issue.due_date);
  const target = deadline || plan;
  const label = deadline ? '締切' : '予定';
  const info = { cls: '', text: '', level: 0, plan: null, over: false, hasDeadline: !!deadline };
  if (!target) return { ...info, cls: 'none', text: '締切未設定' };
  const n = diffDays(target);
  const date = jpDate(target);
  if (col === 'done' || col === 'approved') info.text = `${label} ${date}`;
  else if (n < 0) Object.assign(info, { cls: 'late', text: `${label} ${-n}日超過 ${date}`, level: 2 });
  else if (n === 0) Object.assign(info, { cls: 'soon', text: `${label} 今日 ${date}`, level: 1 });
  else if (n <= CONFIG.dueSoonDays) Object.assign(info, { cls: 'soon', text: `${label} あと${n}日 ${date}`, level: 1 });
  else info.text = `${label} ${date}`;
  if (deadline && plan) {
    info.plan = `予定 ${jpDate(plan)}`;
    info.over = plan > deadline && col !== 'done' && col !== 'approved';
  }
  return info;
}

// 親 → 親の親 … とたどった件名の配列（ルート側が先頭）
function ancestors(issue) {
  const out = [];
  for (let id = issue.parent && issue.parent.id, guard = 0; id && guard < 10; guard++) {
    const p = state.parents.get(id);
    out.unshift(p ? parseTitle(p.subject).text : `#${id}`);
    id = p && p.parentId;
  }
  return out;
}

function issueUrl(id) {
  const base = settings.mode === 'relay' ? state.redmineUrl : settings.mode === 'live' ? settings.url : null;
  return base ? `${base.replace(/\/+$/, '')}/issues/${id}` : null;
}

function renderCard(issue) {
  const col = colOf(issue);
  const due = deadlineInfo(issue);
  const chain = ancestors(issue);
  const url = issueUrl(issue.id);

  let progress = null;
  if (col === 'doing') {
    const steps = CONFIG.statuses.filter(s => s.col === 'doing');
    const current = statusById[issue.status.id].ratio;
    progress = h('div', { class: 'progress', role: 'group', 'aria-label': '進捗' },
      steps.map(s => h('button', {
        type: 'button', draggable: 'false',
        class: s.ratio < current ? 'filled' : '',
        'aria-pressed': String(s.id === issue.status.id),
        title: `進捗を ${s.name} にする`,
        onclick: e => { e.stopPropagation(); if (s.id !== issue.status.id) changeStatus(issue.id, s.id); },
      }, s.ratio)));
  }

  return h('article', {
    class: ['card', due.level === 2 ? 'is-late' : '', state.saving.has(issue.id) ? 'saving' : ''].join(' ').trim(),
    draggable: 'true', tabindex: '0', 'data-id': issue.id,
    'aria-label': `#${issue.id} ${issue.subject}`,
  },
    h('div', { class: 'card-top' },
      h('span', { class: 'parent', title: chain.join(' › ') }, chain.length ? (chain.length > 2 ? '… › ' : '') + chain.slice(-2).join(' › ') : ''),
      renderTag(issue.fixed_version && issue.fixed_version.name)),
    h('h3', { class: 'subject' }, parseTitle(issue.subject).text),
    h('div', { class: 'card-foot' },
      h('span', { class: 'num' }, url ? h('a', { href: url, target: '_blank', rel: 'noopener' }, `#${issue.id}`) : `#${issue.id}`),
      due.plan ? h('span', { class: 'plan' + (due.over ? ' over' : ''), title: 'Redmine の期日（作業完了予定）' }, due.over ? `${due.plan} 締切超え` : due.plan) : null,
      h('span', { class: `due ${due.cls}` }, due.text)),
    progress);
}

// 並び順: バージョン先頭の優先番号 → 締切 → チケット番号
function sortKey(issue) {
  const v = parseVersion(issue.fixed_version && issue.fixed_version.name);
  const { deadline } = parseTitle(issue.subject);
  const target = deadline || parseDate(issue.due_date);
  return [v.prio === null ? 999 : v.prio, target ? target.getTime() : Infinity, issue.id];
}
function byPriority(a, b) {
  const ka = sortKey(a), kb = sortKey(b);
  for (let i = 0; i < ka.length; i++) if (ka[i] !== kb[i]) return ka[i] < kb[i] ? -1 : 1;
  return 0;
}

function renderBoard() {
  const board = $('board');
  const scroll = {};
  board.querySelectorAll('.col').forEach(c => { scroll[c.dataset.col] = c.querySelector('.col-body').scrollTop; });
  const focusedId = document.activeElement && document.activeElement.dataset ? document.activeElement.dataset.id : null;

  const visible = [...state.issues.values()].filter(i => i.assigned_to && i.assigned_to.id === state.view);
  board.style.gridTemplateColumns = `repeat(${visibleColumns().length}, minmax(0, 1fr))`;
  board.replaceChildren(...visibleColumns().map(col => {
    const items = visible.filter(i => colOf(i) === col.key)
      .sort(col.key === 'approved' ? (a, b) => b.updated_on.localeCompare(a.updated_on) : byPriority);
    const locked = col.managerOnly && !isManager();
    return h('section', { class: 'col', 'data-col': col.key, 'aria-label': col.title },
      h('header', { class: 'col-head' },
        h('h2', {}, col.title),
        h('span', { class: 'sub' }, col.sub),
        locked ? h('span', { class: 'lock', title: '上司だけが移動できます' }, '上司のみ') : null,
        h('span', { class: 'count' }, items.length)),
      h('div', { class: 'col-body' },
        items.length ? items.map(renderCard) : h('p', { class: 'empty' }, 'カードはありません')));
  }));
  board.querySelectorAll('.col').forEach(c => { c.querySelector('.col-body').scrollTop = scroll[c.dataset.col] || 0; });
  if (focusedId) { const el = board.querySelector(`.card[data-id="${focusedId}"]`); if (el) el.focus(); }
  renderSummary(visible);
}

function renderSummary(visible) {
  if (state.view === INBOX) {
    const noDeadline = state.inbox.filter(i => !parseTitle(i.subject).deadline).length;
    $('summary').replaceChildren(
      h('span', { class: 'chip' + (state.inbox.length ? ' soon' : '') }, '未整理', h('b', {}, state.inbox.length)),
      h('span', { class: 'chip' }, '締切未記入', h('b', {}, noDeadline)));
    return;
  }
  const active = visible.filter(i => ['todo', 'doing'].includes(colOf(i)));
  const infos = active.map(deadlineInfo);
  const late = infos.filter(x => x.level === 2).length;
  const soon = infos.filter(x => x.level === 1).length;
  const over = infos.filter(x => x.over).length;
  const waiting = visible.filter(i => colOf(i) === 'done').length;
  $('summary').replaceChildren(
    h('span', { class: 'chip' + (late ? ' late' : '') }, '締切超過', h('b', {}, late)),
    h('span', { class: 'chip' + (soon ? ' soon' : '') }, `${CONFIG.dueSoonDays}日以内`, h('b', {}, soon)),
    h('span', { class: 'chip' + (over ? ' soon' : ''), title: '作業完了予定が締切より後になっているチケット' }, '予定が締切超え', h('b', {}, over)),
    h('span', { class: 'chip' }, '手持ち', h('b', {}, active.length)),
    h('span', { class: 'chip' }, '確認待ち', h('b', {}, waiting)));
}

function memberList() {
  return CONFIG.members.some(m => m.id === state.me.id) ? CONFIG.members : [{ id: state.me.id, name: state.me.name }, ...CONFIG.members];
}

function renderTabs() {
  const n = state.inbox.length;
  $('tabs').replaceChildren(
    ...memberList().map(m => h('button', {
      type: 'button', role: 'tab', class: 'tab',
      'aria-selected': String(m.id === state.view),
      onclick: () => switchView(m.id),
    }, m.name, m.id === state.me.id ? h('span', { class: 'me' }, '自分') : null)),
    h('span', { class: 'tab-sep', 'aria-hidden': 'true' }),
    h('button', {
      type: 'button', role: 'tab', class: 'tab inbox-tab',
      'aria-selected': String(state.view === INBOX),
      onclick: () => switchView(INBOX),
    }, '未整理', h('span', { class: 'badge' + (n ? '' : ' zero') }, n)));
}

function renderChrome() {
  const live = settings.mode !== 'mock';
  $('modePill').textContent = settings.mode === 'relay' ? 'リアルタイム接続' : live ? 'Redmine直接接続' : 'モック';
  $('modePill').classList.toggle('live', live);
  $('mockUserWrap').hidden = live;
  const now = startOfToday();
  $('today').textContent = `${now.getFullYear()}年${jpDate(now)}`;
  $('mockUser').replaceChildren(...CONFIG.members.map(m => h('option', { value: m.id, selected: m.id === settings.mockUserId }, m.name)));
}

function render() {
  const inbox = state.view === INBOX;
  $('board').hidden = inbox;
  $('inbox').hidden = !inbox;
  renderTabs();
  if (inbox) { renderInbox(); renderSummary([]); } else renderBoard();
}

/* =====================================================================
 * 7. 描画（未整理の振り分け）
 * ===================================================================== */
function renderInbox() {
  const list = [...state.inbox].sort((a, b) => b.created_on.localeCompare(a.created_on));
  if (!list.some(i => i.id === state.inboxSel)) state.inboxSel = list.length ? list[0].id : null;
  $('inboxCount').textContent = list.length;
  $('mailList').replaceChildren(...(list.length ? list.map(i => {
    const missing = [!i.assigned_to && '担当', !i.fixed_version && 'バージョン'].filter(Boolean).join('・');
    return h('li', {}, h('button', {
      type: 'button', class: 'mail', 'aria-current': String(i.id === state.inboxSel),
      onclick: () => { state.inboxSel = i.id; renderInbox(); },
    },
      h('span', { class: 'meta' },
        h('span', {}, `#${i.id}`),
        h('span', {}, `${jpDate(new Date(i.created_on))} ${hhmm(i.created_on)} 受信`),
        h('span', { class: 'missing' }, `${missing}なし`)),
      h('span', { class: 'title' }, i.subject)));
  }) : [h('li', { class: 'empty' }, '未整理のチケットはありません')]));
  renderTriageForm(state.inbox.find(i => i.id === state.inboxSel));
}

function renderTriageForm(issue) {
  const form = $('triage');
  if (!issue) { form.replaceChildren(h('p', { class: 'hint' }, '左の一覧から整理するチケットを選んでください。')); return; }

  const parsed = parseTitle(issue.subject);
  const versionOpts = [...state.versions].sort((a, b) => a.name.localeCompare(b.name, 'ja'));
  const field = (label, control, required) => h('div', { class: 'field' },
    h('label', { for: control.id || control.querySelector('input,select,textarea').id }, label, required ? h('span', { class: 'req' }, '*') : null), control);

  const deadline = h('input', { type: 'date', id: 'tDeadline', value: parsed.deadline ? isoDate(parsed.deadline) : '' });
  const subject = h('input', { type: 'text', id: 'tSubject', value: parsed.text });
  const version = h('select', { id: 'tVersion' },
    h('option', { value: '' }, '選んでください'),
    versionOpts.map(v => h('option', { value: v.id, selected: issue.fixed_version && issue.fixed_version.id === v.id }, v.name)));
  const assignee = h('select', { id: 'tAssignee' },
    h('option', { value: '' }, '選んでください'),
    CONFIG.members.map(m => h('option', { value: m.id, selected: issue.assigned_to && issue.assigned_to.id === m.id }, m.name)));
  const plan = h('input', { type: 'date', id: 'tPlan', value: issue.due_date || '' });
  const desc = h('textarea', { id: 'tDesc' });
  desc.value = issue.description || '';
  const preview = h('p', { class: 'preview' });
  const error = h('p', { class: 'error-msg', role: 'alert' });
  const submit = h('button', { type: 'submit', class: 'btn primary' });

  const update = () => {
    const dl = deadline.value ? parseDate(deadline.value) : null;
    preview.replaceChildren(h('span', { class: 'lbl' }, 'Redmine に登録される件名'), buildTitle(subject.value.trim(), dl));
    submit.textContent = dl ? '整理して登録' : '締切なしで登録';
  };
  [deadline, subject].forEach(el => el.addEventListener('input', update));
  update();

  form.replaceChildren(
    h('div', {},
      h('h2', {}, `#${issue.id} を整理する`),
      h('p', { class: 'from' }, `${jpDate(new Date(issue.created_on))} ${hhmm(issue.created_on)} 受信　元の件名: ${issue.subject}`)),
    h('div', { class: 'grid2' },
      field('本来の締切（件名の先頭に【M/D】で入ります）', deadline),
      field('作業完了予定（Redmine の期日）', plan)),
    field('件名', subject, true),
    preview,
    h('div', { class: 'grid2' },
      field('対象バージョン', version, true),
      field('担当', assignee, true)),
    field('説明（メール本文。指示を追記できます）', desc),
    error,
    h('div', { class: 'actions' },
      h('p', { class: 'hint' }, '登録すると担当者のボードの「未着手」に入ります。'),
      h('button', { type: 'button', class: 'btn', title: 'チケットは削除せず「中止」にします（Power Automate の重複判定に使うため）', onclick: () => dismissInbox(issue) }, 'タスクではない'),
      submit));

  form.onsubmit = async e => {
    e.preventDefault();
    error.textContent = '';
    if (!subject.value.trim()) { error.textContent = '件名を入力してください。'; subject.focus(); return; }
    if (!version.value) { error.textContent = '対象バージョンを選んでください。'; version.focus(); return; }
    if (!assignee.value) { error.textContent = '担当を選んでください。'; assignee.focus(); return; }
    const dl = deadline.value ? parseDate(deadline.value) : null;
    const fields = {
      subject: buildTitle(subject.value.trim(), dl),
      fixed_version_id: Number(version.value),
      assigned_to_id: Number(assignee.value),
      description: desc.value,
      due_date: plan.value || null,
    };
    submit.disabled = true; submit.textContent = '登録中…';
    try {
      await api.updateIssue(issue.id, fields);
      state.inbox = state.inbox.filter(i => i.id !== issue.id);
      const who = CONFIG.members.find(m => m.id === fields.assigned_to_id);
      toast(`#${issue.id} を${who ? who.name : ''}さんの「未着手」に登録しました`);
      render();
    } catch (err) {
      error.textContent = `登録できませんでした。${err.message}`;
      submit.disabled = false; update();
    }
  };
}

// ノイズのメール（「教えてください」など）を中止にする。チケットは残す
async function dismissInbox(issue) {
  try {
    await api.updateIssue(issue.id, { status_id: cancelStatusId() });
  } catch (err) {
    toast(`#${issue.id} を中止にできませんでした。${err.message}`, { error: true });
    return;
  }
  state.inbox = state.inbox.filter(i => i.id !== issue.id);
  render();
  toast(`#${issue.id} を「中止」にしました`, { action: { label: '元に戻す', run: async () => {
    try { await api.updateIssue(issue.id, { status_id: issue.status.id }); await loadInbox(); state.inboxSel = issue.id; render(); }
    catch (err) { toast(`元に戻せませんでした。${err.message}`, { error: true }); }
  } } });
}

/* =====================================================================
 * 8. データ読み込み
 * ===================================================================== */
async function loadUser(userId) {
  const issues = await api.issuesFor(userId);
  for (const [id, i] of state.issues) if (i.assigned_to && i.assigned_to.id === userId) state.issues.delete(id);
  for (const i of issues) if (statusById[i.status.id]) state.issues.set(i.id, i);
  // 親、親の親…と、つながる限り（最大5階層）取得する
  let pending = issues;
  for (let depth = 0; depth < 5; depth++) {
    const missing = [...new Set(pending.filter(i => i.parent).map(i => i.parent.id))].filter(id => !state.parents.has(id));
    if (!missing.length) break;
    pending = await api.issuesByIds(missing);
    for (const p of pending) state.parents.set(p.id, { subject: p.subject, parentId: p.parent && p.parent.id });
  }
}

async function loadInbox() {
  const open = (await api.inboxIssues()).filter(i => ['todo', 'doing', 'done'].includes(colOf(i)));
  // 子チケットを持ち、担当も期日もないものは「まとめ用」なのでタスクとして扱わない
  const candidates = open.filter(i => !i.assigned_to && !i.due_date).map(i => i.id);
  const containers = await api.withChildren(candidates);
  state.inbox = open.filter(i => !containers.has(i.id));
  if (!state.versions.length && state.inbox.length) state.versions = await api.versions(state.inbox[0].project.id);
}

async function loadView() {
  if (state.view === INBOX) await loadInbox();
  else await Promise.all([loadUser(state.view), loadInbox()]);
}

let relayTimer = null;
function renderRelayPanel() {
  state.me = null;
  $('modePill').textContent = '中継 未接続';
  $('modePill').classList.remove('live');
  $('tabs').replaceChildren();
  $('summary').replaceChildren();
  const tryMock = h('button', { type: 'button', class: 'btn', onclick: () => { settings.mode = 'mock'; saveSettings(); boot(); } }, 'モックで試す');
  const card = servedByRelay
    ? [h('h2', {}, '中継プログラムが止まっています'),
       h('p', {}, 'kanban_relay.py をダブルクリックして起動してください。起動すると、このページは自動でつながります。'),
       h('div', { class: 'links' }, tryMock),
       h('p', { class: 'waiting' }, '中継プログラムの起動を待っています…')]
    : [h('h2', {}, 'このボードは中継プログラムから開きます'),
       h('p', {}, 'あなたのPCで動く中継プログラムが、ボードの画面を出して Redmine とつなぎます。'),
       h('ol', { class: 'steps' },
         h('li', {}, h('span', {}, 'kanban_relay.py と kanban.html を同じフォルダに置きます。')),
         h('li', {}, h('span', {}, 'kanban_relay.py をダブルクリックします。初回だけ API キーの入力と、自動起動するかの確認があります。')),
         h('li', {}, h('span', {}, 'ボードがブラウザで自動的に開きます。次回からはデスクトップの「設計課タスクボード」から開けます。'))),
       h('div', { class: 'links' },
         h('a', { class: 'btn primary', href: relayBase() + '/', target: '_blank', rel: 'noopener' }, '起動済みならここから開く'),
         tryMock)];
  $('board').replaceChildren(h('div', { class: 'connect' }, h('div', { class: 'connect-card' }, card)));
}

async function waitForRelay() {
  const info = await pingRelay();
  if (info) return info;
  renderRelayPanel();
  if (!servedByRelay) return new Promise(() => {}); // 別の場所で開かれたページは中継を使えないので待たない
  return new Promise(resolve => {
    clearInterval(relayTimer);
    relayTimer = setInterval(async () => {
      if (settings.mode !== 'relay') { clearInterval(relayTimer); return; }
      const ok = await pingRelay();
      if (ok) { clearInterval(relayTimer); resolve(ok); }
    }, 3000);
  });
}

async function boot() {
  clearInterval(relayTimer);
  buildApi();
  renderChrome();
  $('board').hidden = false; $('inbox').hidden = true;
  $('board').style.gridTemplateColumns = '';
  $('board').replaceChildren(h('div', { class: 'loading' }, '読み込み中…'));
  if (settings.mode === 'relay') {
    const info = await waitForRelay();
    if (settings.mode !== 'relay') return;
    state.redmineUrl = info.redmine_url;
    renderChrome();
    $('board').replaceChildren(h('div', { class: 'loading' }, '読み込み中…'));
  }
  try {
    state.me = await api.currentUser();
    state.issues.clear(); state.versions = [];
    state.view = state.me.id;
    await loadView();
    render();
  } catch (e) {
    $('board').replaceChildren(h('div', { class: 'loading' }, e.message));
    toast(e.message, { error: true });
  }
}

async function switchView(view) {
  state.view = view;
  renderTabs();
  try { await loadView(); } catch (e) { toast(e.message, { error: true }); }
  render();
}

/* =====================================================================
 * 9. 更新操作（先に画面を変え、失敗したら元に戻す）
 * ===================================================================== */
async function changeStatus(id, statusId, { undoable = false } = {}) {
  const issue = state.issues.get(id);
  if (!issue || state.saving.has(id)) return;
  const prev = { status: issue.status, done_ratio: issue.done_ratio };
  const next = statusById[statusId];
  const fields = { status_id: statusId };
  if (CONFIG.syncDoneRatio && next.ratio != null) fields.done_ratio = next.ratio;

  issue.status = { id: statusId, name: next.name };
  if (fields.done_ratio != null) issue.done_ratio = fields.done_ratio;
  state.saving.add(id);
  renderBoard();
  try {
    await api.updateIssue(id, fields);
    issue.updated_on = new Date().toISOString();
    const undo = undoable ? () => changeStatus(id, prev.status.id) : null;
    toast(`#${id} を「${next.name}」にしました`, { action: undo && { label: '元に戻す', run: undo } });
  } catch (e) {
    issue.status = prev.status;
    issue.done_ratio = prev.done_ratio;
    toast(`#${id} を更新できませんでした。${e.message}`, { error: true });
  } finally {
    state.saving.delete(id);
    renderBoard();
  }
}

function canMove(issue, targetCol) {
  const from = colOf(issue);
  if (from === targetCol) return { ok: false, quiet: true };
  if ((targetCol === 'approved' || from === 'approved') && !isManager()) {
    return { ok: false, reason: '「上司完了」への移動と、そこからの差し戻しは上司だけができます' };
  }
  return { ok: true };
}

function moveToColumn(id, targetCol) {
  const issue = state.issues.get(id);
  if (!issue) return;
  const check = canMove(issue, targetCol);
  if (!check.ok) { if (!check.quiet) toast(check.reason, { error: true }); return; }
  const col = CONFIG.columns.find(c => c.key === targetCol);
  const statusId = statusForColumn(col.key);
  if (!statusId) { toast(`「${col.title}」に当たるステータスが CONFIG.statuses にありません`, { error: true }); return; }
  changeStatus(id, statusId, { undoable: true });
}

/* =====================================================================
 * 10. ドラッグ＆ドロップ / キーボード
 * ===================================================================== */
let dragId = null;
const board = $('board');

board.addEventListener('dragstart', e => {
  const card = e.target.closest && e.target.closest('.card');
  if (!card) return;
  dragId = Number(card.dataset.id);
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', String(dragId));
  card.classList.add('dragging');
  const issue = state.issues.get(dragId);
  board.querySelectorAll('.col').forEach(c => { const r = canMove(issue, c.dataset.col); if (!r.ok && !r.quiet) c.classList.add('drag-denied'); });
  $('cancelZone').hidden = false;
});
board.addEventListener('dragend', () => {
  dragId = null;
  board.querySelectorAll('.dragging, .drag-over, .drag-denied').forEach(el => el.classList.remove('dragging', 'drag-over', 'drag-denied'));
  $('cancelZone').hidden = true;
  $('cancelZone').classList.remove('drag-over');
});
board.addEventListener('dragover', e => {
  const col = e.target.closest && e.target.closest('.col');
  if (!col || dragId == null) return;
  e.preventDefault();
  board.querySelectorAll('.col.drag-over').forEach(c => c !== col && c.classList.remove('drag-over'));
  col.classList.add('drag-over');
});
board.addEventListener('dragleave', e => {
  const col = e.target.closest && e.target.closest('.col');
  if (col && !col.contains(e.relatedTarget)) col.classList.remove('drag-over');
});
board.addEventListener('drop', e => {
  const col = e.target.closest && e.target.closest('.col');
  if (!col || dragId == null) return;
  e.preventDefault();
  moveToColumn(dragId, col.dataset.col);
});

const cancelZone = $('cancelZone');
cancelZone.addEventListener('dragover', e => { e.preventDefault(); cancelZone.classList.add('drag-over'); });
cancelZone.addEventListener('dragleave', () => cancelZone.classList.remove('drag-over'));
cancelZone.addEventListener('drop', e => {
  e.preventDefault();
  if (dragId != null) changeStatus(dragId, cancelStatusId(), { undoable: true });
});

// キーボード: カードを選んで ← → で隣の列へ
board.addEventListener('keydown', e => {
  const card = e.target.closest && e.target.closest('.card');
  if (!card || (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight')) return;
  e.preventDefault();
  const id = Number(card.dataset.id);
  const keys = visibleColumns().map(c => c.key);
  const idx = keys.indexOf(colOf(state.issues.get(id))) + (e.key === 'ArrowRight' ? 1 : -1);
  if (idx >= 0 && idx < keys.length) moveToColumn(id, keys[idx]);
});

/* =====================================================================
 * 11. トースト / 設定ダイアログ
 * ===================================================================== */
function toast(message, { error = false, action = null } = {}) {
  const el = h('div', { class: 'toast' + (error ? ' error' : ''), role: error ? 'alert' : 'status' }, h('span', {}, message));
  if (action) el.append(h('button', { type: 'button', onclick: () => { el.remove(); action.run(); } }, action.label));
  $('toasts').append(el);
  setTimeout(() => el.remove(), error ? 7000 : 5000);
}

function selectedMode() { return $('modeRelay').checked ? 'relay' : $('modeLive').checked ? 'live' : 'mock'; }
function syncModeFields() {
  $('directFields').hidden = selectedMode() !== 'live';
  $('relayHint').hidden = selectedMode() !== 'relay';
  $('testBtn').hidden = selectedMode() === 'mock';
}
['modeRelay', 'modeMock', 'modeLive'].forEach(id => $(id).addEventListener('change', () => { $('testResult').hidden = true; syncModeFields(); }));

function openSettings() {
  $({ relay: 'modeRelay', live: 'modeLive', mock: 'modeMock' }[settings.mode] || 'modeMock').checked = true;
  syncModeFields();
  $('redmineUrl').value = settings.url;
  $('apiKey').value = settings.key;
  $('testResult').hidden = true;
  $('settings').hidden = false;
  $({ relay: 'modeRelay', live: 'modeLive', mock: 'modeMock' }[settings.mode] || 'modeMock').focus();
}
function closeSettings() { $('settings').hidden = true; }

$('settingsBtn').addEventListener('click', openSettings);
$('cancelSettings').addEventListener('click', closeSettings);
$('settings').addEventListener('click', e => { if (e.target === $('settings')) closeSettings(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('settings').hidden) closeSettings(); });

$('testBtn').addEventListener('click', async () => {
  const out = $('testResult');
  out.hidden = false; out.className = 'test-result'; out.textContent = '接続を確認しています…';
  if (selectedMode() === 'relay') {
    const info = await pingRelay();
    out.className = 'test-result ' + (info ? 'ok' : 'ng');
    out.textContent = info
      ? `中継プログラムにつながりました。${info.user.name} さんとして ${info.redmine_url} に接続しています。`
      : '中継プログラムに接続できません。kanban_relay.py が起動しているか確認してください。';
    return;
  }
  const url = $('redmineUrl').value.trim(), key = $('apiKey').value.trim();
  if (!url || !key) { out.className = 'test-result ng'; out.textContent = 'URL と API キーを入力してください。'; return; }
  try {
    const me = await createRedmineApi(url, key).currentUser();
    out.className = 'test-result ok';
    out.textContent = `接続できました。ログインユーザー: ${me.name}（ID ${me.id}）`;
  } catch (e) {
    out.className = 'test-result ng';
    out.textContent = `${e.message}\nこのページを開いている場所: ${location.origin}`;
  }
});

$('settingsForm').addEventListener('submit', e => {
  e.preventDefault();
  const mode = selectedMode();
  const url = $('redmineUrl').value.trim(), key = $('apiKey').value.trim();
  if (mode === 'live' && (!url || !key)) {
    const out = $('testResult'); out.hidden = false; out.className = 'test-result ng';
    out.textContent = 'Redmine に接続するには URL と API キーが必要です。';
    return;
  }
  settings = { ...settings, mode, url, key };
  saveSettings();
  closeSettings();
  boot();
});

$('mockUser').addEventListener('change', e => {
  settings.mockUserId = Number(e.target.value);
  saveSettings();
  boot();
});

$('reloadBtn').addEventListener('click', async () => {
  if (!state.me) return boot();
  try { await loadView(); render(); toast('最新の状態を読み込みました'); }
  catch (e) { toast(e.message, { error: true }); }
});

boot();
</script>
