[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "baseball-clop"
version = "0.1.0"
description = "草野球の試合映像から投球単位のクリップとSBO/ランナーのオーバーレイ情報を生成するパイプライン"
requires-python = ">=3.10"
dependencies = [
    "opencv-python-headless>=4.8",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
baseball-clop = "baseball_clop.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
